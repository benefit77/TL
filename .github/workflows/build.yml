name: Build Windows and Linux

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
            make: make
          - name: windows-x64-mingw
            os: windows-2022
            make: mingw32-make

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libusb-1.0-0-dev

      - name: Install Qt (Linux)
        if: runner.os == 'Linux'
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          arch: gcc_64
          cache: true

      - name: Install Qt (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          arch: win64_mingw81
          tools: 'tools_mingw,qt.tools.win64_mingw810'
          cache: true

      - name: Verify compiler
        shell: bash
        run: |
          qmake -v
          ${{ matrix.make }} --version

      - name: Build projects
        shell: bash
        run: |
          set -euo pipefail

          QMAKE_ARGS="CONFIG+=release CONFIG-=debug CONFIG-=debug_and_release"

          echo "=== Build COM_and_CAN_Responder ==="
          mkdir -p build/responder
          cd build/responder
          qmake ../../COM_and_CAN_Responder/COM_and_CAN_Responder.pro $QMAKE_ARGS
          ${{ matrix.make }} -j2
          cd ../..

          echo "=== Build COM_and_CAN_TEST ==="
          mkdir -p build/test
          cd build/test
          qmake ../../COM_and_CAN_TEST/COM_and_RJ45_TEST.pro $QMAKE_ARGS
          ${{ matrix.make }} -j2
          cd ../..

      - name: Collect binaries
        shell: bash
        run: |
          set -e
          mkdir -p dist
          find build -type f \
            \( -name 'COM_and_CAN_Responder' -o -name 'COM_and_CAN_Responder.exe' \
               -o -name 'COM_and_RJ45_TEST' -o -name 'COM_and_RJ45_TEST.exe' \) \
            -exec cp -v {} dist/ \;
          ls -la dist

      - name: Deploy Qt runtime (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -e
          # 不要给 windeployqt 传 --release/--debug：MinGW 构建下它无法可靠区分
          # debug/release（只能看 PE 的 IMAGE_FILE_DEBUG_STRIPPED 标志），一旦强制
          # --release，就会把 Qt 自带的 plugins/platforms/qwindows.dll 误判成 debug
          # 而跳过，报 “Unable to find the platform plugin.”。不传该参数时按
          # MatchDebugOrRelease 处理，只匹配发布版文件名（qwindows.dll），不会带上
          # qwindowsd.dll 等调试文件。
          echo "qmake      : $(command -v qmake)"
          echo "Qt plugins : $(qmake -query QT_INSTALL_PLUGINS)"
          ls "$(qmake -query QT_INSTALL_PLUGINS)/platforms" \
            || echo "::warning::未找到 platforms 插件目录"

          for exe in dist/*.exe; do
            if ! output=$(windeployqt --no-translations --no-opengl-sw "$exe" 2>&1); then
              printf '%s\n' "$output"
              # 把失败原因写进注解，方便在 Actions 页面上直接看到
              echo "::error::windeployqt $(basename "$exe") 失败: $(printf '%s' "$output" | tail -n 6 | sed ':a;N;$!ba;s/\n/%0A/g')"
              exit 1
            fi
            printf '%s\n' "$output"
          done
          ls -la dist
          ls -la dist/platforms || { echo "::error::Qt 平台插件 qwindows.dll 未部署"; exit 1; }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/
          if-no-files-found: error
